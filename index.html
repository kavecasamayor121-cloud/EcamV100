<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECam — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-background"><div class="glow glow-one"></div><div class="glow glow-two"></div></div>
<main class="login-shell">
  <section class="login-brand">
    <div class="brand-icon">E</div>
    <h1>ECam</h1>
    <p>Capture more. Create better.</p>
  </section>
  <section class="login-card">
    <div class="camera-symbol">◉</div>
    <h2>Welcome back</h2>
    <p class="login-subtitle">Log in to open your ECam studio.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter your username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" id="togglePassword">Show</button>
      </div>
      <div class="login-options">
        <label class="remember"><input id="remember" type="checkbox"><span>Remember me</span></label>
        <a href="register.html" class="forgot">Create account</a>
      </div>
      <button class="login-button" type="submit">Log In <span>→</span></button>
      <p id="loginMessage" class="login-message"></p>
    </form>
    <div class="demo-account">
      <strong>New to ECam?</strong>
      <span>Create an account with your full name, username, Gmail and password.</span>
    </div>
  </section>
  <footer>ECam Camera Studio</footer>
</main>
<script>
const form=document.getElementById("loginForm");
const msg=document.getElementById("loginMessage");
const pass=document.getElementById("password");
document.getElementById("togglePassword").onclick=()=>{
  pass.type=pass.type==="text"?"password":"text";
  document.getElementById("togglePassword").textContent=pass.type==="text"?"Hide":"Show";
};
form.onsubmit=e=>{
  e.preventDefault();
  const username=document.getElementById("username").value.trim().toLowerCase();
  const password=pass.value;
  const users=JSON.parse(localStorage.getItem("ecamUsers")||"[]");
  const user=users.find(u=>u.username===username&&u.password===password);
  if(!user){
    msg.textContent="Incorrect username or password.";
    msg.className="login-message error";
    return;
  }
  sessionStorage.setItem("ecamLoggedIn","true");
  sessionStorage.setItem("ecamUser",username);
  if(document.getElementById("remember").checked)localStorage.setItem("ecamRemembered",username);
  location.href="camera.html";
};
const remembered=localStorage.getItem("ecamRemembered");
if(remembered)document.getElementById("username").value=remembered;
</script>
</body>
</html>
